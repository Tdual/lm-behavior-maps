[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lm-behavior-maps"
version = "0.1.0"
description = "Locate LLM agents by what they would do: teacher-forced policy embeddings and KL-tracking distances, without rollouts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "tdual" }]
keywords = ["llm", "agent", "evaluation", "kl-divergence", "information-geometry", "embedding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40"]
lmeval = ["lm-eval>=0.4"]
stats = ["scipy>=1.10"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.10"]
all = ["torch>=2.1", "transformers>=4.40", "lm-eval>=0.4", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
lm-behavior = "lm_behavior.cli:main"

[project.urls]
Homepage = "https://github.com/Tdual/lm-behavior-maps"
Issues = "https://github.com/Tdual/lm-behavior-maps/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_behavior"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
