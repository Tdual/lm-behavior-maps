name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor declared in requires-python, and the newest supported
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The adapter tests import the real langgraph and crewai classes on
      # purpose -- that is how a required field added upstream gets caught.
      # torch is deliberately absent: HFScorer's own tests skip without it, and
      # pulling it in would triple the install for no extra coverage.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # Fails on a README that PyPI would reject, before a release can.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*
